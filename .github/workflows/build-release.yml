name: Build and Release Unroute

on:
  push:
    branches:
      - development
    tags:
      - 'v*'
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.github/AMO.md'
  pull_request:
    branches:
      - development
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.github/AMO.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unroute-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Test, Browser Smoke & Build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      publish: ${{ steps.plan.outputs.publish }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 22.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify registry signatures
        run: npm audit signatures

      - name: Audit dependencies
        run: npm run audit:ci

      - name: Verify project version is synchronized
        run: npm run version:check

      - name: Resolve release eligibility
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/release-plan.mjs

      - name: Verify release notes for a new version
        if: steps.plan.outputs.publish == 'true'
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          notes_file=".github/release-notes/v${version}.md"
          if [[ ! -s "$notes_file" ]] || ! grep -Eq '^- [^[:space:]]' "$notes_file"; then
            echo "Add a bullet list of changes to $notes_file before publishing this version." >&2
            exit 1
          fi

      - name: Run code linter
        run: npm run lint

      - name: Run automated unit tests
        run: npm test

      - name: Build Chromium and Firefox extensions
        run: npm run build:all

      - name: Validate Firefox extension
        run: npm run lint:firefox

      - name: Run Chrome Stable MV3 browser smoke
        env:
          CHROME_BIN: /usr/bin/google-chrome
          # Linux Chrome uses the runner's English UI locale despite --lang=ru.
          UNROUTE_TEST_LOCALE: en
        run: npm run test:browser:chrome

      - name: Install isolated Firefox Stable
        run: node scripts/install-test-firefox.mjs

      - name: Run Firefox MV3 tab-routing smoke
        env:
          # The isolated distribution installed above contains en-US resources.
          UNROUTE_TEST_LOCALE: en
        run: npm run test:browser:firefox

      - name: Verify build leaves source files unchanged
        run: git diff --exit-code

      - name: Prepare store submissions and reviewer sources
        run: npm run store:package

      - name: Upload store submissions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: store-submissions
          path: artifacts/v*/*
          if-no-files-found: error
          retention-days: 30

      - name: Extract extension version
        shell: bash
        run: |
          version=$(node -p "require('./dist/chromium/manifest.json').version")
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Create Chrome Web Store archive
        shell: bash
        run: |
          cd dist/chromium
          zip -r "$GITHUB_WORKSPACE/unroute-v${VERSION}-chrome-mv3.zip" .

      - name: Create Firefox archive
        shell: bash
        run: |
          cd dist/firefox
          zip -r "$GITHUB_WORKSPACE/unroute-v${VERSION}-firefox-mv3.zip" .

      - name: Upload verified Chrome artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unroute-v${{ env.VERSION }}-chrome-mv3
          path: unroute-v${{ env.VERSION }}-chrome-mv3.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload verified Firefox artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unroute-v${{ env.VERSION }}-firefox-mv3
          path: unroute-v${{ env.VERSION }}-firefox-mv3.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: verify
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve release version and tag
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          release_tag="v${version}"
          if [[ "${GITHUB_REF}" == refs/tags/* && "${GITHUB_REF_NAME}" != "${release_tag}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match extension version ${release_tag}" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"

      - name: Setup release preparation tools
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked release preparation dependencies
        run: npm ci --no-audit --no-fund

      - name: Download the verified archive from this workflow run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-artifact"
          gh run download "$GITHUB_RUN_ID" \
            --name "unroute-v${VERSION}-chrome-mv3" \
            --dir "$RUNNER_TEMP/release-artifact"
          gh run download "$GITHUB_RUN_ID" \
            --name "unroute-v${VERSION}-firefox-mv3" \
            --dir "$RUNNER_TEMP/release-artifact"
          gh run download "$GITHUB_RUN_ID" --name store-submissions --dir "$RUNNER_TEMP/store-submissions"
          source_archive=$(find "$RUNNER_TEMP/store-submissions" -type f -name "unroute-v${VERSION}-sources.zip" -print -quit)
          test -n "$source_archive"
          cp "$source_archive" "$RUNNER_TEMP/release-artifact/"
          chrome_archive="$RUNNER_TEMP/release-artifact/unroute-v${VERSION}-chrome-mv3.zip"
          firefox_archive="$RUNNER_TEMP/release-artifact/unroute-v${VERSION}-firefox-mv3.zip"
          test -f "$chrome_archive"
          test -f "$firefox_archive"
          node .github/scripts/amo-release.mjs prepare "$RUNNER_TEMP/release-artifact"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${RELEASE_TAG}"
          chrome_archive="$RUNNER_TEMP/release-artifact/unroute-v${VERSION}-chrome-mv3.zip"
          firefox_archive="$RUNNER_TEMP/release-artifact/unroute-v${VERSION}-firefox-mv3.zip"
          source_archive="$RUNNER_TEMP/release-artifact/unroute-v${VERSION}-sources.zip"
          request_file="$RUNNER_TEMP/release-artifact/unroute-v${VERSION}-amo-request.json"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to overwrite its assets." >&2
            exit 1
          fi
          target_args=()
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            target_args=(--target "$GITHUB_SHA")
          fi
          gh release create "$tag" \
            "$chrome_archive" "$chrome_archive.sha256" \
            "$firefox_archive" "$firefox_archive.sha256" \
            "$source_archive" "$source_archive.sha256" "$request_file" \
            "${target_args[@]}" \
            --notes-file "$RUNNER_TEMP/release-artifact/release-notes.md" \
            --title "Unroute v${VERSION}"

  amo-publish:
    name: Submit Firefox to the public AMO catalog
    needs: [verify, release]
    if: needs.verify.outputs.publish == 'true' && vars.AMO_LISTED_ENABLED == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/amo-publish.yml
    with:
      version: ${{ needs.verify.outputs.version }}
      submit: true
    secrets: inherit

  cws-publish:
    name: Submit Chrome to the Chrome Web Store
    needs: [verify, release]
    if: needs.verify.outputs.publish == 'true' && vars.CWS_PUBLISH_ENABLED == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/cws-publish.yml
    with:
      version: ${{ needs.verify.outputs.version }}
    secrets: inherit
